<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
            height: 500px;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        td {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <table border="1" width="500" height="500" cellpadding="10" cellspacing="10">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr align="center" colspan="3">
                <td>John</td>
                <td>20</td>
                <td>Male</td>
            </tr>
            <tr>
                <td>Jane</td>
                <td>21</td>
                <td>Female</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
