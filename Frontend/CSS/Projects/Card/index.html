<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Image -->
        <div class="image">
            <img src="Untitled.jpg" alt="Card">
        </div>
        <!-- Description -->
         <div class="description">
            <h2>Amazing Product</h2>
            <p>$99.99</p>
            <p>
                This amazing product will revolutionize your life with its incredible features and sleek design.
            </p>
         </div>
         <div class="button">
            <button>
                <i class="fa-solid fa-cart-shopping"></i>
                Add to Cart
            </button>
         </div>
    </div>

</body>
</html>
