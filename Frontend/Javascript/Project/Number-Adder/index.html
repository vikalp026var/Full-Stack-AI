<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Adder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Number Adder</h1>
        <p>Enter two numbers below and click the button to add them together.</p>
        <div class="number-input">
            <input type="number" id="number1" placeholder="Enter first number">
            <p id="plusSign">+</p>
            <input type="number" id="number2" placeholder="Enter second number">
        </div>
        <p id="result"></p>
        <button class="add-button">
            Add Numbers
        </button>
    </div>
    <script src="script.js"></script>
</body>
</html>
